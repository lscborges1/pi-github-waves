<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="A downstream issue stays blocked until every one of its own blockers is merged, then it is released">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1000" height="380" fill="url(#bg)"/>

  <rect x="24" y="52" width="452" height="280" rx="18" fill="#0e1626" stroke="#233148" stroke-width="1.5"/>
  <rect x="524" y="52" width="452" height="280" rx="18" fill="#0e1626" stroke="#233148" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="16" font-weight="700">
    <text x="250" y="36" fill="#9aa6b8">Waiting</text>
    <text x="750" y="36" fill="#34d399">Released</text>
  </g>

  <path d="M472,193 L528,193" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowBlue)" fill="none"/>

  <g fill="none" stroke-width="2.5">
    <line x1="133" y1="155" x2="277" y2="188" stroke="#3b82f6" marker-end="url(#arrowBlue)"/>
    <line x1="133" y1="231" x2="277" y2="199" stroke="#f59e0b" marker-end="url(#arrowAmber)"/>
    <line x1="633" y1="155" x2="777" y2="188" stroke="#3b82f6" marker-end="url(#arrowBlue)"/>
    <line x1="633" y1="231" x2="777" y2="199" stroke="#3b82f6" marker-end="url(#arrowBlue)"/>
  </g>

  <circle cx="800" cy="193" r="40" fill="#34d399" opacity="0.15"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700">
    <circle cx="110" cy="150" r="24" fill="#10b981" stroke="#34d399" stroke-width="2.5"/>
    <text x="110" y="150" fill="#ecfdf5">1</text>
    <circle cx="110" cy="236" r="24" fill="#f59e0b" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="110" y="236" fill="#fffbeb">2</text>
    <circle cx="300" cy="193" r="24" fill="#4f46e5" stroke="#818cf8" stroke-width="2.5"/>
    <text x="300" y="193" fill="#e0e7ff">3</text>
    <circle cx="610" cy="150" r="24" fill="#10b981" stroke="#34d399" stroke-width="2.5"/>
    <text x="610" y="150" fill="#ecfdf5">1</text>
    <circle cx="610" cy="236" r="24" fill="#10b981" stroke="#34d399" stroke-width="2.5"/>
    <text x="610" y="236" fill="#ecfdf5">2</text>
    <circle cx="800" cy="193" r="26" fill="#10b981" stroke="#34d399" stroke-width="2.5"/>
    <text x="800" y="193" fill="#ecfdf5">3</text>
  </g>

  <g stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="127" cy="133" r="11" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <g transform="translate(127,133)"><path d="M-5,0 L-1,4.5 L6,-5" stroke="#34d399"/></g>
    <circle cx="127" cy="219" r="11" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/>
    <g transform="translate(127,219)" fill="none" stroke="#fbbf24">
      <circle r="5.5" stroke-width="1.6"/>
      <path d="M0,0 V-3.2 M0,0 H2.4" stroke-width="1.6"/>
    </g>
    <circle cx="317" cy="176" r="11" fill="#0b1220" stroke="#818cf8" stroke-width="1.5"/>
    <g transform="translate(317,176)">
      <rect x="-4" y="-1" width="8" height="7" rx="1" fill="#e0e7ff" stroke="none"/>
      <path d="M-3,-1 V-3 a3,3 0 0 1 6,0 V-1" fill="none" stroke="#e0e7ff" stroke-width="1.6"/>
    </g>
    <circle cx="627" cy="133" r="11" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <g transform="translate(627,133)"><path d="M-5,0 L-1,4.5 L6,-5" stroke="#34d399"/></g>
    <circle cx="627" cy="219" r="11" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <g transform="translate(627,219)"><path d="M-5,0 L-1,4.5 L6,-5" stroke="#34d399"/></g>
    <circle cx="817" cy="176" r="11" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
    <g transform="translate(817,176)"><path d="M1,-6 L-4,1 L-0.5,1 L-1,6 L4,-1 L0.5,-1 Z" fill="#ecfdf5" stroke="none"/></g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="14" font-weight="600">
    <text x="250" y="356" fill="#9aa6b8">still blocked — #2 not merged</text>
    <text x="750" y="356" fill="#34d399">released — both blockers merged</text>
  </g>
</svg>
