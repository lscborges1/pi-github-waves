<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Dependency wave graph: nodes grouped into three waves, where ready issues flow downstream to blocked issues">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrowReady" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <g fill="none" stroke="url(#streak)" opacity="0.12">
    <path d="M-20,70 C 200,20 400,120 600,70 S 1000,20 1220,70" stroke-width="34"/>
    <path d="M-20,180 C 200,130 400,230 600,180 S 1000,130 1220,180" stroke-width="46"/>
    <path d="M-20,300 C 200,250 400,350 600,300 S 1000,250 1220,300" stroke-width="34"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#7c8aa3" font-size="13" font-weight="700" letter-spacing="2">
    <text x="300" y="48">WAVE 1</text>
    <text x="560" y="48">WAVE 2</text>
    <text x="820" y="48">WAVE 3</text>
  </g>

  <g fill="none" stroke-width="2.5">
    <line x1="326" y1="110" x2="534" y2="110" stroke="#3b82f6" marker-end="url(#arrowReady)"/>
    <line x1="323" y1="122" x2="537" y2="238" stroke="#475569" marker-end="url(#arrow)"/>
    <line x1="326" y1="250" x2="534" y2="250" stroke="#3b82f6" marker-end="url(#arrowReady)"/>
    <line x1="585" y1="117" x2="795" y2="173" stroke="#475569" marker-end="url(#arrow)"/>
    <line x1="585" y1="243" x2="795" y2="187" stroke="#475569" marker-end="url(#arrow)"/>
  </g>

  <circle cx="300" cy="110" r="42" fill="#34d399" opacity="0.16"/>
  <circle cx="300" cy="250" r="42" fill="#34d399" opacity="0.16"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700">
    <circle cx="300" cy="110" r="26" fill="#10b981" stroke="#34d399" stroke-width="2.5"/>
    <text x="300" y="110" fill="#ecfdf5">1</text>
    <circle cx="300" cy="250" r="26" fill="#10b981" stroke="#34d399" stroke-width="2.5"/>
    <text x="300" y="250" fill="#ecfdf5">2</text>
    <circle cx="560" cy="110" r="26" fill="#4f46e5" stroke="#818cf8" stroke-width="2.5"/>
    <text x="560" y="110" fill="#e0e7ff">3</text>
    <circle cx="560" cy="250" r="26" fill="#4f46e5" stroke="#818cf8" stroke-width="2.5"/>
    <text x="560" y="250" fill="#e0e7ff">4</text>
    <circle cx="820" cy="180" r="28" fill="#7c3aed" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="820" y="180" fill="#f3e8ff">5</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="14" font-weight="600">
    <text x="300" y="330" fill="#34d399">ready</text>
    <text x="560" y="330" fill="#94a3b8">blocked</text>
    <text x="820" y="330" fill="#94a3b8">blocked</text>
  </g>
</svg>
